<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%230f1115%27/%3E%3Ccircle cx=%2716%27 cy=%2713%27 r=%275%27 fill=%27%23ffb020%27/%3E%3Cpath d=%27M16 19 L16 27%27 stroke=%27%23ffb020%27 stroke-width=%273%27/%3E%3C/svg%3E">
<title>ExplorerApp</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --tx:#e8eaf0; --tx2:#9aa2b1; --tx3:#6b7382;
    --acc:#ffb020; --ok:#34d399;
    --sheet-h: 46vh;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #map{position:absolute;inset:0}
  .leaflet-container{background:#0b0d11}
  /* OSM-tegels iets ontzadigen zodat de pins eruit springen */
  .leaflet-tile-pane{filter:saturate(.72) contrast(1.04) brightness(.98)}
  .leaflet-control-attribution{background:#0f1115cc!important;color:var(--tx3)!important;
    font-size:10px!important;padding:2px 6px!important}
  .leaflet-control-attribution a{color:var(--tx2)!important}
  .leaflet-bar a{background:#171a21!important;color:var(--tx2)!important;border-color:var(--line)!important}
  .leaflet-bar a:hover{color:var(--tx)!important}

  /* ---- top bar ---- */
  #top{position:absolute;top:0;left:0;right:0;z-index:1150;padding:10px 10px 11px;
    background:var(--bg);border-bottom:1px solid var(--line);pointer-events:none;
    transition:right .28s cubic-bezier(.2,.8,.2,1)}
  #top>*{pointer-events:auto}
  .brand{display:flex;align-items:baseline;gap:8px;padding:2px 4px 8px}
  .brand b{font-size:16px;letter-spacing:.2px}
  .brand span{font-size:12px;color:var(--tx3)}
  #chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#171a21cc;backdrop-filter:blur(8px);
    color:var(--tx2);padding:6px 11px;border-radius:999px;font-size:13px;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
  .chip:hover{color:var(--tx);border-color:#3b4250}
  .chip.on{color:#0f1115;font-weight:600;border-color:transparent}
  .chip.uit{opacity:.45}
  .chip.on i{color:inherit!important}
  .chip i{font-style:normal;font-size:12px}
  .chip,.tegel{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

  /* ---- markers ---- */
  .pin{position:absolute;left:0;top:0;width:var(--s,44px);height:var(--s,44px);cursor:pointer;
    transform:translate(-50%,-50%);transition:width .2s,height .2s,opacity .2s}
  .pin.weg{opacity:0;pointer-events:none;width:0;height:0}
  .pin .disc{position:absolute;inset:0;border-radius:50%;background-size:cover;background-position:center;
    border:2.5px solid var(--c,#888);box-shadow:0 3px 10px #000a;background-color:#222833;
    display:flex;align-items:center;justify-content:center;font-size:calc(var(--s,44px)*.39);transition:transform .15s;
    color:var(--c,#ccc);font-weight:700}
  .pin:hover .disc{transform:scale(1.12)}
  .pin.sel{--s:52px!important}
  .pin.sel .disc{transform:scale(1.06);border-color:var(--acc);box-shadow:0 0 0 4px #ffb02033,0 4px 14px #000b}
  .pin .ring{position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--c,#888);opacity:.55;
    animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.85);opacity:.6}70%{transform:scale(1.35);opacity:0}100%{opacity:0}}
  body.ver .pin .ring{display:none}

  /* ---- cluster: een bol met een aantal, tot er nog maar één punt over is ---- */
  .cluster{position:absolute;left:0;top:0;transform:translate(-50%,-50%);
    width:var(--s,44px);height:var(--s,44px);border-radius:50%;cursor:pointer;
    display:grid;place-items:center;background:#171a21f2;border:2.5px solid var(--c,#6b7382);
    box-shadow:0 3px 12px #000a;transition:transform .15s}
  .cluster:hover{transform:translate(-50%,-50%) scale(1.12)}
  .cluster b{color:var(--tx);font-size:calc(var(--s,44px)*.36);line-height:1;font-weight:700}
  .cluster i{position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--c,#6b7382);
    opacity:.28}
  .pin .tag{position:absolute;top:calc(var(--s,44px) + 3px);left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:11px;font-weight:600;color:var(--tx);background:#0f1115cc;padding:2px 7px;border-radius:6px;
    border:1px solid var(--line);opacity:0;transition:.15s;pointer-events:none}
  .pin:hover .tag,.pin.sel .tag{opacity:1}

  /* ---- floating controls ---- */
  #fabs{position:absolute;right:12px;z-index:1050;display:flex;flex-direction:column;gap:8px;
    bottom:calc(12px + env(safe-area-inset-bottom));transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
  body.open #fabs{bottom:calc(var(--sheet-h) + 12px)}
  .fab{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:#171a21ee;
    backdrop-filter:blur(8px);color:var(--tx);display:grid;place-items:center;cursor:pointer;padding:0}
  .fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .fab:hover{background:#20242e}
  .fab:active{background:#262b36}
  .fab.on{background:var(--acc);color:#0f1115;border-color:transparent}
  /* in- en uitzoomen horen bij elkaar: één blokje, zoals elke kaart-app */
  #zoomPaar{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;
    overflow:hidden;background:#171a21ee;backdrop-filter:blur(8px)}
  #zoomPaar .fab{border:none;border-radius:0;background:none;backdrop-filter:none}
  #zoomPaar .fab:first-child{border-bottom:1px solid var(--line)}

  /* ---- bottom sheet ---- */
  /* Drie standen, zoals een kaart-app hoort te doen: dicht (weggeschoven),
     half (je ziet de pin én de tekst) en vol. Het paneel is altijd even hoog;
     de stand is een verschuiving, zodat slepen één rechte lijn is.          */
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:1100;
    height:calc(100dvh - var(--kop, 96px) - 6px);
    background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    transform:translateY(101%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column;box-shadow:0 -10px 40px #0008;overscroll-behavior:contain;
    will-change:transform}
  body.sleept #sheet{transition:none}
  body.open #sheet{transform:translateY(calc(100% - var(--sheet-h)))}
  body.open.max #sheet{transform:none}
  body.open:not(.max) #sheetScroll{flex:0 0 calc(var(--sheet-h) - 27px)}
  #grip{padding:12px 0 10px;display:grid;place-items:center;cursor:grab;flex:0 0 auto;touch-action:none}
  #grip div{width:40px;height:5px;border-radius:3px;background:#39404e}
  #sheetScroll{overflow-y:auto;padding:0 16px calc(22px + env(safe-area-inset-bottom));flex:1}

  .hero{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
  .hero img{width:96px;height:96px;object-fit:cover;border-radius:12px;flex:0 0 auto;background:#222833}
  .hero .ph{width:96px;height:96px;border-radius:12px;flex:0 0 auto;background:#222833;display:grid;
    place-items:center;color:var(--tx3);font-size:11px;text-align:center;padding:6px;line-height:1.3}
  h1{font-size:20px;margin:0 0 3px;line-height:1.25}
  .sub{font-size:12.5px;color:var(--tx3);margin-bottom:8px}
  .glance{font-size:15px;color:var(--tx);margin:0}

  .scores{display:flex;gap:14px;margin:12px 0;padding:11px 12px;background:var(--card2);border-radius:11px}
  .sc{flex:1}
  .sc b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);
    font-weight:700;margin-bottom:5px}
  .bar{height:5px;border-radius:3px;background:#2a2f3a;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px}
  .sc em{font-style:normal;font-size:11px;color:var(--tx2);float:right;font-weight:600}

  .tabs{display:flex;gap:5px;margin:14px 0 12px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:7px 12px;border-radius:9px;background:var(--card2);color:var(--tx2);
    font-size:13px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
  .tab.on{background:var(--acc);color:#0f1115;font-weight:600}

  .body h4{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);margin:16px 0 6px}
  .body p{margin:0 0 13px;line-height:1.62}
  .note{background:var(--card2);border-left:2px solid var(--acc);padding:10px 12px;border-radius:0 9px 9px 0;
    font-size:14px;color:var(--tx2);margin:10px 0}
  .warn{background:#2a1f14;border-left:2px solid #f59e0b;padding:10px 12px;border-radius:0 9px 9px 0;
    font-size:13.5px;color:#e3c08a;margin:10px 0}
  .warn b{color:#f6c66a;display:block;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:3px}
  .cap{font-size:11.5px;color:var(--tx3);margin:-4px 0 12px}

  /* inline verwijzing naar een ander object, thema of niveau */
  .lnk{color:#7dd3fc;cursor:pointer;text-decoration:underline;
    text-decoration-color:#7dd3fc66;text-underline-offset:2.5px;text-decoration-thickness:1px}
  .lnk:hover{color:#bae6fd;text-decoration-color:#bae6fd}
  .lnk.plek:after{content:"\2009\25c9";font-size:.72em;vertical-align:.12em;opacity:.75}

  .links a{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;background:var(--card2);
    border-radius:9px;margin-bottom:6px;color:var(--tx2);text-decoration:none;font-size:13px;line-height:1.4}
  .links a:hover{color:var(--tx);background:#242938}
  .links span{color:var(--tx3);flex:0 0 auto}

  .conn{display:flex;flex-direction:column;gap:6px}
  .conn button{display:flex;gap:10px;align-items:center;text-align:left;width:100%;
    background:var(--card2);border:1px solid transparent;border-radius:10px;padding:10px 11px;
    color:var(--tx);font:inherit;font-size:13.5px;cursor:pointer}
  .conn button:hover{border-color:#3b4250;background:#242938}
  .conn .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .conn .rel{color:var(--tx3);font-size:12px;display:block;margin-top:1px}
  .conn strong{font-weight:600}
  .conn a{display:flex;gap:10px;align-items:center;text-align:left;width:100%;
    background:var(--card2);border:1px solid transparent;border-radius:10px;padding:10px 11px;
    color:var(--tx);font-size:13.5px;text-decoration:none;line-height:1.45}
  .conn a:hover{border-color:#3b4250;background:#242938}
  .conn .ext{margin-left:auto;color:var(--tx3);flex:0 0 auto;padding-left:6px}

  .areas{padding:2px 0 4px}
  .area{background:var(--card2);border-radius:11px;padding:12px;margin-bottom:8px;cursor:pointer;
    border:1px solid transparent}
  .area:hover{border-color:#3b4250}
  .area b{display:block;margin-bottom:2px}
  .area span{font-size:12.5px;color:var(--tx2)}
  .area em{font-style:normal;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--acc);display:block;margin-top:6px}

  #lodBadge{position:absolute;left:12px;z-index:1050;bottom:calc(12px + env(safe-area-inset-bottom));
    background:#171a21e8;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;
    padding:7px 13px;font-size:12px;color:var(--tx2);opacity:0;transition:.2s;pointer-events:none;
    margin-left:44px}
  #lodBadge.on{opacity:1}
  /* ---- schaalpad, tijdlijn, thema-tegels ---- */
  .pad{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:12px;font-size:12px}
  .pad button{background:var(--card2);border:1px solid transparent;color:var(--tx2);
    border-radius:7px;padding:4px 9px;font:inherit;cursor:pointer}
  .pad button:hover{color:var(--tx);border-color:#3b4250}
  .pad span{color:var(--tx3)}
  .pad b{background:var(--acc);color:#0f1115;border-radius:7px;padding:4px 9px;font-weight:600}

  .tl{position:relative;padding-left:18px;margin-top:4px}
  .tl:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tlr{position:relative;display:flex;gap:11px;align-items:baseline;padding:7px 0;cursor:pointer}
  .tlr:hover .tln{color:var(--acc)}
  .tlr:before{content:"";position:absolute;left:-17px;top:14px;width:8px;height:8px;border-radius:50%;
    background:var(--c,#6b7382);border:2px solid var(--card)}
  .tlj{flex:0 0 52px;font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;color:var(--tx2)}
  .tln{font-size:13.5px;color:var(--tx);line-height:1.35}
  .tln em{font-style:normal;display:block;color:var(--tx3);font-size:12px;margin-top:1px}

  .tegels{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .tegel{background:var(--card2);border:1px solid transparent;border-radius:11px;padding:11px;
    cursor:pointer;text-align:left;color:var(--tx);font:inherit}
  .tegel:hover{border-color:#3b4250;background:#242938}
  .tegel b{display:flex;align-items:center;gap:7px;margin-bottom:4px;font-size:13.5px}
  .tegel b i{font-style:normal}
  .tegel span{display:block;font-size:11.5px;color:var(--tx3);line-height:1.4}
  .tegel u{display:block;text-decoration:none;font-size:10.5px;color:var(--tx2);margin-top:6px;
    text-transform:uppercase;letter-spacing:.5px}

  .brand{cursor:pointer}
  .brand:hover b{color:var(--acc)}

  /* ---- de verkenner: het startscherm, en later de zoeker ----------------
     Dit ligt bóven de kaart. De kaart ingezoomd op een plaats is geen
     startpunt maar een focusmodus: het gevolg van een keuze hier.         */
  #zoek{position:absolute;inset:0;z-index:1400;background:#0b0d11f2;backdrop-filter:blur(4px);
    display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
  body.zoek #zoek{display:block}
  #zoekX{width:38px;height:38px;border-radius:12px;flex:0 0 auto;
    background:#171a21e8;border:1px solid var(--line);color:var(--tx2);font-size:18px;cursor:pointer}
  #zoekX:hover{color:var(--tx)}
  .zkKader{max-width:560px;margin:0 auto;padding:5vh 18px calc(34px + env(safe-area-inset-bottom))}
  .zkBrand{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
  .zkBrand b{font-size:26px;letter-spacing:.2px}
  .zkBrand span{display:block;width:100%;color:var(--tx2);margin:2px 0 18px;font-size:14px;line-height:1.5}
  .zkVeld{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
    border-radius:13px;padding:3px 14px;margin-bottom:6px}
  .zkVeld:focus-within{border-color:var(--acc)}
  .zkVeld:before{content:"\2315";color:var(--tx3);font-size:18px}
  #zoekVeld{flex:1;background:none;border:none;outline:none;color:var(--tx);font:inherit;
    font-size:16px;padding:11px 0;min-width:0}
  #zoekVeld::placeholder{color:var(--tx3)}
  .zkKop{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);margin:20px 0 7px}
  .zkRij{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:var(--card);
    border:1px solid transparent;border-radius:11px;padding:11px 13px;margin-bottom:6px;cursor:pointer;
    color:var(--tx);font:inherit}
  .zkRij:hover{border-color:#3b4250;background:#20242e}
  .zkRij .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .zkRij i{font-style:normal;flex:0 0 auto;font-size:16px;width:18px;text-align:center}
  .zkRij .zkTx{flex:1;min-width:0}
  .zkRij b{display:block;font-size:14.5px;font-weight:600}
  .zkRij .zkSub{display:block;font-size:12.5px;color:var(--tx3);line-height:1.4}
  .zkRij em{font-style:normal;margin-left:auto;flex:0 0 auto;font-size:10.5px;color:var(--tx3);
    text-transform:uppercase;letter-spacing:.5px;padding-left:8px}
  .zkLeeg{color:var(--tx3);font-size:14px;padding:16px 4px}
  .zkVoet{margin-top:24px;text-align:center}
  .zkVoet button{background:none;border:1px solid var(--line);color:var(--tx2);border-radius:999px;
    padding:9px 18px;font:inherit;font-size:13.5px;cursor:pointer}
  .zkVoet button:hover{color:var(--tx);border-color:#3b4250}

  #zoekKnop{margin-left:auto;align-self:center;width:30px;height:30px;border-radius:9px;
    border:1px solid var(--line);background:#171a21cc;color:var(--tx2);font-size:15px;
    cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
  #zoekKnop:hover{color:var(--tx);border-color:#3b4250}

  /* ---- waar ben ik, en welke kant kijk ik op ----
     De kaart blijft op noord (rastertegels met ingebakken straatnamen kantelen
     mee, en dat is onleesbaar). In plaats daarvan draait de kegel: die wijst
     waar je naar kijkt, zoals in elke kaart-app met de kaart op noord.      */
  .mijPin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:0;height:0}
  .mijPin b{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;
    background:#3b82f6;border:2.5px solid #fff;box-shadow:0 2px 7px #000a}
  .mijPin .kegel{position:absolute;left:-48px;top:-48px;width:96px;height:96px;opacity:0;
    transform:rotate(var(--hoek,0deg));transition:transform .16s linear,opacity .3s}
  .mijPin.koers .kegel{opacity:1}

  /* ---- feedback ---- */
  .fbSoorten{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
  .fbSoort{flex:1 1 45%;background:var(--card2);border:1px solid transparent;color:var(--tx2);
    border-radius:10px;padding:10px 8px;font:inherit;font-size:13px;cursor:pointer}
  .fbSoort:hover:not(:disabled){color:var(--tx);border-color:#3b4250}
  .fbSoort.on{background:var(--acc);color:#0f1115;font-weight:600}
  .fbSoort:disabled{opacity:.35;cursor:default}
  #sheetScroll textarea{width:100%;background:var(--card2);border:1px solid var(--line);
    border-radius:10px;color:var(--tx);font:inherit;font-size:14px;padding:10px 12px;resize:vertical}
  #sheetScroll textarea:focus{outline:none;border-color:var(--acc)}
  .fbActie{display:block;width:100%;margin-top:10px;background:var(--card2);border:1px solid var(--line);
    color:var(--tx);border-radius:11px;padding:12px;font:inherit;font-size:14px;cursor:pointer}
  .fbActie:hover{border-color:#3b4250;background:#242938}
  .fbActie.hoofd{background:var(--acc);color:#0f1115;font-weight:600;border-color:transparent}
  .fbPin{position:absolute;left:0;top:0;width:34px;height:34px;transform:translate(-50%,-50%);
    border-radius:50%;background:#ffb020;border:3px solid #0f1115;cursor:grab;
    box-shadow:0 0 0 4px #ffb02055,0 3px 10px #000a}
  .fbPin:active{cursor:grabbing}
  .fbPin:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#0f1115}

  #toast{position:absolute;left:50%;bottom:80px;transform:translate(-50%,20px);z-index:1200;
    background:#171a21f0;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;
    color:var(--tx2);opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  @media(min-width:820px){
    :root{--sheet-h:100vh}
    #sheet{left:auto;right:0;top:0;width:420px;height:100vh;border-radius:0;
      border-left:1px solid var(--line);border-top:none;transform:translateX(101%)}
    body.open #sheet{transform:none}
    body.open:not(.max) #sheetScroll{flex:1 1 auto}
    #fabs{bottom:20px}
    body.open #fabs{bottom:20px;right:436px}
    /* header stopt bij de zijbalk in plaats van eroverheen te lopen */
    body.open #top{right:420px;border-right:1px solid var(--line)}
    #sheet{padding-top:0}
    #grip{display:none}
    #sheetScroll{padding-top:18px}
    #toast{bottom:28px}
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div class="brand"><b>ExplorerApp</b><span id="brandSub">proefdata</span>
    <button id="zoekKnop" title="Zoeken — plaats, thema of plek">&#8981;</button></div>
  <div id="chips"></div>
</div>

<div id="fabs">
  <div id="zoomPaar">
    <button class="fab" id="fIn" title="Inzoomen" aria-label="Inzoomen">
      <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
    <button class="fab" id="fUit" title="Uitzoomen" aria-label="Uitzoomen">
      <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
  </div>
  <button class="fab" id="fLoc" title="Waar ben ik?" aria-label="Waar ben ik?">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg></button>
</div>

<div id="sheet">
  <div id="grip"><div></div></div>
  <div id="sheetScroll"></div>
</div>

<div id="zoek">
  <div class="zkKader">
    <div class="zkBrand"><b>ExplorerApp</b><button id="zoekX" title="Naar de kaart">×</button>
      <span>Zoek een plaats, een thema of een plek. De kaart volgt je keuze.</span></div>
    <div class="zkVeld"><input id="zoekVeld" type="search" autocomplete="off" spellcheck="false"
      placeholder="Zoek: stad, streek, thema, plek&hellip;"></div>
    <div id="zoekUit"></div>
  </div>
</div>

<div id="lodBadge"></div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// data.js wordt hieronder dynamisch geladen met een cache-buster: zonder dat blijft
// de browser na een wijziging in de data hardnekkig de oude versie tonen.
function start(){
const A = window.APP, T = A.themas;
const ALL = [...A.pois, ...A.gebiedsverhalen];
const byId = id => ALL.find(x => x.id === id);
const img = (f,w) => f ? "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(f) + "?width=" + (w||800) : null;
const kleur = o => (T[o.themas[0]] || {}).kleur || "#888";
// [[id]] of [[id|tekst]] wordt een klikbare verwijzing. Bij een object met
// een co\u00f6rdinaat springt de kaart mee \u2014 dat is de deeplink naar de plek.
function verrijk(txt){
  return "<p>" + esc(txt).split("\n\n").join("</p><p>")
    .replace(/\[\[([a-z0-9-]+)(?:\|([^\]]*))?\]\]/g, (_, id, label) => {
      const o = byId(id), th = T[id], pl = A.plaatsen.find(p => p.id === id);
      const doel = o || th || pl;
      if (!doel) return label || id;
      const naam = label || doel.naam || doel.label || id;
      const plek = o && o.coord ? " plek" : "";
      return '<a class="lnk' + plek + '" data-link="' + id + '">' + naam + "</a>";
    }) + "</p>";
}

function bindLinks(){
  scroll.querySelectorAll("[data-link]").forEach(a => a.onclick = () => {
    const id = a.dataset.link;
    if (T[id])                               focusThema(id, true);
    else if (A.plaatsen.some(p => p.id===id)) focusPlaats(id);
    else                                     open(id);
  });
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- kaart ---------- */
window.map = null;
/* zoomSnap 0: de pinch eindigt waar je hem loslaat in plaats van terug te
   klikken naar een heel niveau. maxZoom 21 met bounceAtZoomLimits uit: verder
   inzoomen dan de tegels gaan mag, de kaart schaalt dan op (zie tileLayer)
   in plaats van zwart te knipperen en terug te springen.                   */
const map = L.map("map", { zoomControl:false, attributionControl:false,
    maxZoom:21, zoomSnap:0, wheelPxPerZoomLevel:90, bounceAtZoomLimits:false })
  .setView(A.gebied.centrum, A.gebied.zoom);
function meetKop(){
  document.documentElement.style.setProperty("--kop",
    document.getElementById("top").offsetHeight + "px");
}
meetKop();
window.addEventListener("resize", meetKop);
if (window.ResizeObserver) new ResizeObserver(meetKop).observe(document.getElementById("top"));
window.map = map;
document.getElementById("fIn").onclick  = () => map.zoomIn();
document.getElementById("fUit").onclick = () => map.zoomOut();
L.control.attribution({ position:"bottomright", prefix:false })
  .addAttribution('&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bijdragers').addTo(map);
// maxNativeZoom 19: dieper dan dat bestaan er geen OSM-tegels, dus schaalt
// Leaflet de laatste op. Het beeld wordt zachter, maar je kunt wel verder —
// nodig op pleinschaal, waar beelden tien meter uit elkaar staan.
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxNativeZoom:19, maxZoom:21 }).addTo(map);

const netLayer = L.layerGroup().addTo(map);   // verbindingslijnen van het geopende punt
const markers = {};
let actief = null, huidig = null, tab = "verhaal";  // gedeeld: selectie en tabblad
const filterAan = {};                              // thema -> aan/uit, gevuld bij de chips

A.pois.forEach(p => {
  const el = document.createElement("div");
  el.className = "pin";
  el.style.setProperty("--c", kleur(p));
  el.innerHTML =
    (p.verhaal >= 75 ? '<div class="ring"></div>' : '') +
    '<div class="disc"' + (p.afbeelding ? ' style="background-image:url(&quot;' + img(p.afbeelding,160) + '&quot;)"' : '') + '>' +
      (p.afbeelding ? '' : ((T[p.themas[0]]||{}).icoon || "•")) +
    '</div><div class="tag">' + esc(p.naam) + '</div>';
  el.onclick = e => { e.stopPropagation(); open(p.id); };
  const m = L.marker(p.coord, {
    icon: L.divIcon({ html: el, className:"", iconSize:[0,0], iconAnchor:[0,0] }),
    riseOnHover: true
  });                       // nog niet op de kaart: hertekenen() bepaalt dat
  markers[p.id] = { m, el, poi:p, op:false };
});
const clusterLaag = L.layerGroup().addTo(map);

/* ---------- clusteren ----------------------------------------------------
   Alle punten blijven bestaan; ze worden alleen samengevat. Liggen twee pins
   op het scherm te dicht op elkaar, dan worden ze één bol met een aantal.
   Klik je die aan, dan zoomt de kaart in tot ze uit elkaar vallen. Bij één
   punt zie je de foto. Zo raak je nooit iets kwijt.                        */

function zichtbaarVoorFilter(poi){
  return poi.themas.some(t => filterAan[t]);
}

function hertekenen(){
  const z = map.getZoom();
  const maat = z < 13 ? 34 : z < 15 ? 40 : z < 17.5 ? 46 : z < 19.5 ? 38 : 32;
  const straal = maat * 1.15;
  document.body.classList.toggle("ver", z < 14);
  clusterLaag.clearLayers();

  // 1. wat mag er van het filter meedoen
  const mee = Object.values(markers).filter(x => zichtbaarVoorFilter(x.poi));
  Object.values(markers).forEach(x => {
    if (!mee.includes(x) && x.op) { map.removeLayer(x.m); x.op = false; }
  });

  // 2. groeperen in schermruimte. Het geselecteerde punt zaait als eerste,
  //    daarna het laagste niveau en de hoogste verhaalwaarde.
  const gesorteerd = mee.slice().sort((a,b) =>
       (a.poi.id===huidig ? -1 : b.poi.id===huidig ? 1 : 0)
    || (a.poi.niveau||3) - (b.poi.niveau||3)
    || b.poi.verhaal - a.poi.verhaal);

  const groepen = [];
  gesorteerd.forEach(x => {
    const pt = map.latLngToContainerPoint(x.poi.coord);
    const bij = groepen.find(g => Math.hypot(g.pt.x-pt.x, g.pt.y-pt.y) < straal
                                  && g.leden[0].poi.id !== huidig);
    if (bij) bij.leden.push(x); else groepen.push({ pt, leden:[x] });
  });

  // 3. tekenen
  groepen.forEach(g => {
    if (g.leden.length === 1){
      const x = g.leden[0];
      if (!x.op) { x.m.addTo(map); x.op = true; }
      x.el.style.setProperty("--s", maat + "px");
      return;
    }
    g.leden.forEach(x => { if (x.op) { map.removeLayer(x.m); x.op = false; } });

    // kleur van het meest voorkomende thema in de groep
    const tel = {};
    g.leden.forEach(x => x.poi.themas.forEach(t => { if (filterAan[t]) tel[t] = (tel[t]||0)+1; }));
    const hoofdthema = Object.keys(tel).sort((a,b) => tel[b]-tel[a])[0];
    const grootte = Math.round(maat + Math.min(g.leden.length, 8) * 1.8);

    const el = document.createElement("div");
    el.className = "cluster";
    el.style.setProperty("--s", grootte + "px");
    el.style.setProperty("--c", (T[hoofdthema]||{}).kleur || "#6b7382");
    el.innerHTML = "<i></i><b>" + g.leden.length + "</b>";
    el.title = g.leden.map(x => x.poi.naam).join(" · ");

    const mid = g.leden.reduce((a,x) => [a[0]+x.poi.coord[0], a[1]+x.poi.coord[1]], [0,0])
                       .map(v => v / g.leden.length);
    el.onclick = e => {
      e.stopPropagation();
      const b = L.latLngBounds(g.leden.map(x => x.poi.coord));
      // valt de groep op de maximale zoom nog niet uit elkaar (een plein vol
      // beelden), dan toont een lijst wat erin zit — nooit vastlopen op een bol
      const zMax = map.getMaxZoom();
      const bij = map.getBoundsZoom(b, false, L.point(90, 110));
      if (map.getZoom() >= zMax - 0.01 || (bij >= zMax && map.getZoom() >= zMax - 1))
        return toonGroep(g.leden.map(x => x.poi));
      if (b.getNorth() === b.getSouth() && b.getEast() === b.getWest())
        map.setView(b.getCenter(), Math.min(map.getZoom() + 3, zMax));
      else
        map.fitBounds(b, { padding:[90,110], maxZoom:zMax });
    };
    L.marker(mid, { icon: L.divIcon({ html: el, className:"", iconSize:[0,0], iconAnchor:[0,0] }) })
      .addTo(clusterLaag);
  });

  chipsVolgen();

  const aan = mee.length, totaal = A.pois.length;
  const badge = document.getElementById("lodBadge");
  badge.textContent = aan < totaal ? aan + " van " + totaal + " punten" : "";
  badge.classList.toggle("on", aan < totaal);
}
map.on("zoomend moveend", hertekenen);

// startbeeld: alle punten in beeld. Naar je eigen omgeving ga je met de knop
// rechtsonder — niet automatisch, want een kaart die bij het laden zelf
// wegspringt is verwarrend. De verkenner zit achter ⌕ linksboven.
map.fitBounds(L.latLngBounds(A.pois.map(p => p.coord)), { padding:[70,90], maxZoom:16 });

/* ---------- tik of ingedrukt houden -----------------------------------
   Eén knop, twee bedoelingen: tikken doet het gewone (filteren, openen),
   ingedrukt houden laat de tekst zien. Wordt gebruikt voor chips en tegels. */
function bindDruk(el, tik, lang){
  let timer = null, langGedaan = false, y0 = 0;
  el.addEventListener("pointerdown", e => {
    langGedaan = false; y0 = e.clientY;
    timer = setTimeout(() => { timer = null; langGedaan = true; lang(); }, 480);
  });
  const stop = () => { if (timer){ clearTimeout(timer); timer = null; } };
  ["pointerup","pointerleave","pointercancel"].forEach(ev => el.addEventListener(ev, stop));
  el.addEventListener("pointermove", e => { if (Math.abs(e.clientY - y0) > 10) stop(); });
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.onclick = () => { if (langGedaan){ langGedaan = false; return; } tik(); };
}
const alleThemasAan = () => Object.keys(T).forEach(x => filterAan[x] = true);
const alleenThema   = k  => Object.keys(T).forEach(x => filterAan[x] = (x === k));
function pasOpThema(k){
  const met = objectenVanThema(k).filter(o => o.coord);
  if (met.length) map.fitBounds(L.latLngBounds(met.map(o => o.coord)), kaartPas());
}

/* ---------- thema-filters: alles staat standaard aan ----------------------
   Tik op een chip: alleen dit thema op de kaart (nog eens: weer alles).
   Ingedrukt houden: het themaverhaal.                                      */
Object.keys(T).forEach(k => filterAan[k] = true);

const chips = document.getElementById("chips");
Object.entries(T).forEach(([k,t]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.dataset.k = k;
  b.innerHTML = '<i style="color:' + t.kleur + '">' + t.icoon + "</i>" + t.label;
  bindDruk(b, () => {
    const alleenDit = filterAan[k] && Object.keys(T).every(x => x === k || !filterAan[x]);
    if (alleenDit) alleThemasAan(); else { alleenThema(k); pasOpThema(k); }
    verf();
  }, () => focusThema(k, true));
  chips.appendChild(b);
});
meetKop();   // de chips maken de kopbalk hoger; het paneel rekent daarmee

const alles = document.createElement("button");
alles.className = "chip"; alles.id = "chipAlles"; alles.textContent = "Alles";
alles.onclick = () => { alleThemasAan(); verf(); };
chips.prepend(alles);   // vooraan, anders staat de reset buiten beeld op een telefoon

// alleen de thema's van de pins die nu in beeld zijn; staat er niets in beeld,
// dan zie je ze allemaal
function chipsVolgen(){
  const b = map.getBounds();
  const inBeeld = new Set();
  A.pois.forEach(p => { if (b.contains(p.coord)) p.themas.forEach(t => inBeeld.add(t)); });
  const alles = inBeeld.size === 0, solo = soloThema();
  [...document.getElementById("chips").children].forEach(c => {
    if (!c.dataset.k) return;
    c.style.display = (alles || inBeeld.has(c.dataset.k) || c.dataset.k === solo) ? "" : "none";
  });
}

// staat er precies één thema aan, dan is dat het gekozen thema
function soloThema(){
  const aan = Object.keys(T).filter(k => filterAan[k]);
  return aan.length === 1 ? aan[0] : null;
}
const chipVolgorde = [...chips.children];   // de oorspronkelijke volgorde, om te herstellen
function verf(){
  const solo = soloThema();
  // rustig standaardbeeld: alles aan = neutrale chips. Eén thema gekozen: dat
  // komt vooraan in zijn eigen kleur, de rest dimt.
  [...chips.children].forEach(c => {
    if (!c.dataset.k) return;
    const k = c.dataset.k;
    c.classList.toggle("uit", !filterAan[k]);
    c.classList.toggle("on", k === solo);
    c.style.background = k === solo ? T[k].kleur : "";
  });
  if (solo){
    const el = chips.querySelector('.chip[data-k="' + solo + '"]');
    const alles = document.getElementById("chipAlles");
    chips.insertBefore(el, alles.nextSibling);
    chips.scrollLeft = 0;
  } else chipVolgorde.forEach(c => chips.appendChild(c));
  const allesAan = Object.values(filterAan).every(Boolean);
  document.getElementById("chipAlles").style.display = allesAan ? "none" : "";
  hertekenen();
}

/* ---------- netwerk ---------- */
function tekenNet(focus){
  netLayer.clearLayers();
  const gedaan = new Set();
  const bron = focus ? [byId(focus)] : A.pois;
  bron.forEach(p => (p.verbindingen||[]).forEach(v => {
    const q = byId(v.id);
    if (!q || !q.coord || !p.coord) return;
    const sleutel = [p.id,q.id].sort().join("|");
    if (gedaan.has(sleutel)) return;
    gedaan.add(sleutel);
    if (true) L.polyline([p.coord,q.coord], {   // donkere omranding zodat de lijn leesbaar blijft
      color:"#0f1115", weight:6, opacity:.5 }).addTo(netLayer);
    L.polyline([p.coord,q.coord], {
      color: focus ? "#ffb020" : kleur(p),
      weight: focus ? 3 : 2.4,
      opacity: focus ? .95 : .7,
      dashArray: focus ? "7 6" : "4 6"
    }).addTo(netLayer);
  }));
}
// Er is geen knop meer voor het hele netwerk: te verwarrend, en de kaart, de
// inline verwijzingen en het tabblad Verbindingen laten hetzelfde al zien. Bij
// een geopend punt worden zijn eigen verbindingen wél getekend, zie open().

/* ---------- locatie ----------------------------------------------------
   Twee momenten: wie ergens stáát wil zien wat er om hem heen is; wie thuis
   zit, zoekt zelf. Het eerste is één tik op de knop rechtsonder — bewust een
   handeling, want een kaart die bij het laden zelf wegspringt is verwarrend.
   Ver van alle steden krijg je een hint welke stad het dichtst is.         */
let locMarker = null, mijnKoers = null;

// de stip met de kijkkegel; de kegel verschijnt pas als de koers bekend is
function mijnMarker(c){
  if (locMarker) map.removeLayer(locMarker);
  const el = document.createElement("div");
  el.className = "mijPin";
  el.innerHTML =
    '<svg class="kegel" viewBox="-48 -48 96 96" aria-hidden="true">' +
      '<defs><radialGradient id="kegelKleur" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="46">' +
        '<stop offset="0" stop-color="#60a5fa" stop-opacity=".8"/>' +
        '<stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient></defs>' +
      '<path d="M0 0 L-19 -42 A46 46 0 0 1 19 -42 Z" fill="url(#kegelKleur)"/></svg><b></b>';
  locMarker = L.marker(c, { interactive:false, zIndexOffset:1500,
    icon: L.divIcon({ html: el, className:"", iconSize:[0,0], iconAnchor:[0,0] }) }).addTo(map);
  if (mijnKoers != null) zetKoers(mijnKoers);
}

function zetKoers(graden){
  mijnKoers = graden;
  const el = locMarker && locMarker.getElement && locMarker.getElement();
  const pin = el && el.querySelector(".mijPin");
  if (!pin) return;
  pin.style.setProperty("--hoek", graden.toFixed(1) + "deg");
  pin.classList.add("koers");
}

/* De kompasrichting van het toestel. Android geeft die via
   deviceorientationabsolute (alpha loopt tegen de klok in, dus 360 - alpha),
   iOS via webkitCompassHeading en pas na expliciete toestemming. Lukt het
   niet, dan blijft de kegel gewoon weg — de stip werkt ook zonder.        */
let kompasAan = false;
function kompasStart(){
  if (kompasAan) return; kompasAan = true;
  let absoluutGezien = false;
  const lees = e => {
    let h = null;
    if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;
    else if (typeof e.alpha === "number" && (e.absolute || e.type === "deviceorientationabsolute"))
      h = 360 - e.alpha;
    if (h == null || isNaN(h)) return;
    if (e.type === "deviceorientationabsolute") absoluutGezien = true;
    const draai = (screen.orientation && screen.orientation.angle) || 0;
    zetKoers((h + draai) % 360);
  };
  const luister = () => {
    window.addEventListener("deviceorientationabsolute", lees, true);
    // alleen als er geen absolute meting komt terugvallen op de relatieve
    setTimeout(() => { if (!absoluutGezien) window.addEventListener("deviceorientation", lees, true); }, 1500);
  };
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === "function")
    D.requestPermission().then(r => { if (r === "granted") luister(); }).catch(() => {});
  else luister();
}

function naarLocatie(stil){
  if (!navigator.geolocation){ if (!stil) toast("Geolocatie niet beschikbaar"); return; }
  if (!stil) toast("Locatie zoeken…");
  navigator.geolocation.getCurrentPosition(
    p => {
      const c = [p.coords.latitude, p.coords.longitude];
      mijnMarker(c);
      kompasStart();
      const dichtst = stedenMetInhoud().filter(p => p.kaart)
        .map(p => [map.distance(c, p.kaart.centrum), p]).sort((a,b) => a[0]-b[0])[0];
      const dichtbij = dichtst && dichtst[0] <= 20000;
      map.setView(c, 15, { animate: !stil });
      if (!dichtbij && dichtst)
        toast("Je bent " + Math.round(dichtst[0]/1000) + " km van " + dichtst[1].naam +
              ", de dichtstbijzijnde stad met verhalen");
      else if (!stil) toast("Gevonden");
    },
    () => { if (!stil) toast("Locatie geweigerd of niet beschikbaar"); },
    { timeout: 8000, maximumAge: 120000 });
}
document.getElementById("fLoc").onclick = () => naarLocatie(false);

/* ---------- sheet ---------- */
const sheet = document.getElementById("sheet"), scroll = document.getElementById("sheetScroll");
map.on("click", sluit);

/* ---------- de standen van het paneel ------------------------------------
   dicht / half / vol. De tekst scrolt in elke stand; de vorm verander je
   alleen via de greep: tikken wisselt half en vol, slepen gaat omhoog naar
   vol en omlaag naar half en daarna weg. Op een breed scherm is het paneel
   een zijbalk en is dit alles niet van toepassing.                         */
const mobiel = () => !matchMedia("(min-width:820px)").matches;
function stand(){
  return !document.body.classList.contains("open") ? "dicht"
       : document.body.classList.contains("max") ? "vol" : "half";
}
let paneelSleutel = null;   // wat er open staat; een tabwissel is geen nieuw paneel
function toonPaneel(sleutel){
  const nieuw = paneelSleutel !== sleutel;
  paneelSleutel = sleutel;
  if (nieuw || stand() === "dicht") zetStand("half");
}
function zetStand(st){
  sheet.style.transform = "";
  if (st === "dicht") return sluit();
  document.body.classList.add("open");
  document.body.classList.toggle("max", st === "vol");
}
// hoeveel het paneel in de stand half naar beneden staat, in pixels
const halfVerschuiving = () => sheet.getBoundingClientRect().height - window.innerHeight * 0.46;
// het punt waar de kaart heen moet zodat een coördinaat in het zichtbare deel valt
function zichtbaarCentrum(coord, z){
  const maat = map.getSize();
  const schuif = mobiel() ? [0, maat.y * 0.23] : [210, 0];
  return map.unproject(map.project(L.latLng(coord), z).add(schuif), z);
}
// ruimte voor het paneel bij fitBounds
function kaartPas(){
  if (stand() === "dicht") return { padding:[60,80], maxZoom:16 };
  return mobiel()
    ? { paddingTopLeft:[40, 100], paddingBottomRight:[40, window.innerHeight * 0.46 + 40], maxZoom:16 }
    : { paddingTopLeft:[40, 100], paddingBottomRight:[460, 40], maxZoom:16 };
}

let sleep = null, netGesleept = false;
sheet.addEventListener("pointerdown", e => {
  if (!mobiel() || stand() === "dicht" || !e.target.closest("#grip")) return;
  // alles wat layout kost één keer meten, niet bij elke beweging
  const H = sheet.getBoundingClientRect().height, halfY = halfVerschuiving();
  sleep = { y0:e.clientY, stand:stand(), actief:false, id:e.pointerId,
            basis: stand() === "vol" ? 0 : halfY, H, halfY,
            y:0, spoor:[{ t:performance.now(), y:e.clientY }], raf:null };
});
sheet.addEventListener("pointermove", e => {
  if (!sleep) return;
  const dy = e.clientY - sleep.y0;
  if (!sleep.actief){
    if (Math.abs(dy) < 6) return;
    sleep.actief = true;
    try { sheet.setPointerCapture(sleep.id); } catch (_) {}
    document.body.classList.add("sleept");
  }
  // het spoor van de laatste 120 ms bewaren: daaruit volgt de snelheid bij loslaten
  const t = performance.now();
  sleep.spoor.push({ t, y:e.clientY });
  while (sleep.spoor.length > 2 && t - sleep.spoor[0].t > 120) sleep.spoor.shift();
  sleep.y = Math.max(0, sleep.basis + dy);
  if (!sleep.raf) sleep.raf = requestAnimationFrame(() => {
    if (sleep){ sheet.style.transform = "translateY(" + sleep.y + "px)"; sleep.raf = null; }
  });
  e.preventDefault();
}, { passive:false });
function sleepEinde(){
  if (!sleep) return;
  const s = sleep; sleep = null;
  if (s.raf) cancelAnimationFrame(s.raf);
  document.body.classList.remove("sleept");
  if (!s.actief) return;
  netGesleept = true; setTimeout(() => netGesleept = false, 50);
  // snelheid over het laatste stukje (px per ms), en waar het paneel dan heen zou
  // glijden: loslaatpunt plus een stukje in de bewegingsrichting. Zo sluit één
  // lange haal naar beneden, en wordt een korte veeg vanaf vol half.
  const a = s.spoor[0], b = s.spoor[s.spoor.length - 1];
  const v = b.t > a.t ? (b.y - a.y) / (b.t - a.t) : 0;
  const doelY = s.y + v * 160;
  const doel = [["vol", 0], ["half", s.halfY], ["dicht", s.H]]
    .sort((a,b) => Math.abs(a[1]-doelY) - Math.abs(b[1]-doelY))[0][0];
  zetStand(doel);
}
["pointerup","pointercancel"].forEach(ev => sheet.addEventListener(ev, sleepEinde));
document.getElementById("grip").onclick = () => {
  if (netGesleept) return;
  zetStand(stand() === "vol" ? "half" : "vol");
};

function sluit(){

function open(id, houdTab){

    h += verrijk(o.verhaal_tekst);

  }

  if (tab === "let")    h += o.let_hierop ? '<div class="note">' + esc(o.let_hierop) + "</div>"

/* ---------- schaal-stapel: plaatsen en thema's -------------------------
   Regel: een hoger niveau vat alleen samen wat lager al gesourced is.      */

const plaatsById = id => A.plaatsen.find(p => p.id === id);
const objectenVanThema = k => ALL.filter(o => (o.themas||[]).includes(k));

// elk object hoort bij één plaats (`plaats`); een streek of land "bevat"
// alles wat via de stapel eronder hangt
const plaatsVan = o => o.plaats || "kerkrade";
function ligtIn(plaatsId, doelId){
  let p = plaatsById(plaatsId);
  while (p){ if (p.id === doelId) return true; p = p.ouder ? plaatsById(p.ouder) : null; }
  return false;
}
const objectenVanPlaats = id => ALL.filter(o => ligtIn(plaatsVan(o), id));
// een stad "met inhoud" heeft zélf pins; een streek of land erft ze alleen via de stapel
const stedenMetInhoud = () => A.plaatsen.filter(p => ALL.some(o => plaatsVan(o) === p.id && o.coord));

function stapelVan(id){            // van land naar beneden tot deze plaats
  const rij = []; let p = plaatsById(id);
  while (p){ rij.unshift(p); p = p.ouder ? plaatsById(p.ouder) : null; }
  return rij;
}

function tijdlijn(objecten){
  const rij = objecten.filter(o => o.jaar).sort((a,b) => a.jaar - b.jaar);
  if (!rij.length) return "<p>Nog geen jaartallen vastgelegd.</p>";
  return '<div class="tl">' + rij.map(o =>
    '<div class="tlr" data-go="' + o.id + '" style="--c:' + kleur(o) + '">' +
      '<div class="tlj">' + (o.jaar_circa ? "ca. " : "") + o.jaar + "</div>" +
      '<div class="tln">' + esc(o.naam) +
        "<em>" + esc((o.ondertitel || o.glance).slice(0, 78)) + "</em></div></div>").join("") + "</div>";
}

function themaTegels(sleutels){
  return '<div class="tegels">' + sleutels.map(k => {
    const t = T[k]; if (!t) return "";
    const aantal = objectenVanThema(k).length;
    return '<button class="tegel" data-thema="' + k + '">' +
      "<b><i style=\"color:" + t.kleur + '">' + t.icoon + "</i>" + esc(t.label) + "</b>" +
      "<span>" + esc((t.glance||"").slice(0, 90)) + "</span>" +
      "<u>" + aantal + " plekken \u00b7 " + (t.schaal||"stad") + "</u></button>";
  }).join("") + "</div>";
}

function schaalpad(actiefId, extra){
  const rij = stapelVan(actiefId);
  let h = '<div class="pad">';
  rij.forEach((p, i) => {
    h += i ? "<span>\u203a</span>" : "";
    h += (p.id === actiefId && !extra)
      ? "<b>" + esc(p.naam) + "</b>"
      : '<button data-plaats="' + p.id + '">' + esc(p.naam) + "</button>";
  });
  if (extra) h += "<span>\u203a</span><b>" + esc(extra) + "</b>";
  return h + "</div>";
}

  if (plaatsTab === "bron"){
    h += '<div class="links">' + (p.bronnen||[]).map(b =>

    h += '<div class="cap" style="margin-top:10px">Elk niveau is een eigen verhaal met eigen bronnen. Een streekverhaal vat de steden niet samen \u2014 het legt uit wat er speelt, en de plekken eronder laten zien hoe dat er hier uitziet.</div>';
  }
  if (p.onbevestigd) h += '<div class="warn"><b>Onbevestigd</b>' + esc(p.onbevestigd) + "</div>";

function openThema(k){
  const t = T[k]; if (!t) return;
  huidig = null;

function bindKaart(hertekenSelf, zetTab, tabAttr){

/* ---------- de verkenner ---------------------------------------------------
   De zoeker achter ⌕ linksboven. Er zijn twee momenten om te verkennen:
   vooraf (thuis of in het hotel) en ter plekke. Ter plekke begint op de
   kaart; vooraf begint hier — bij een vraag: welke plaats, welk thema,
   welke plek? De kaart ingezoomd op wat je koos is de fócusmodus die volgt. */

const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

// focus: de kaart springt naar wat je koos, daarna opent het bijbehorende verhaal
function focusPlaats(id){
  const p = plaatsById(id); if (!p) return;
  alleThemasAan(); verf();          // een stad kies je heel, niet gefilterd
  const eigen = objectenVanPlaats(p.id).filter(o => o.coord);
  if (eigen.length)
    map.fitBounds(L.latLngBounds(eigen.map(o => o.coord)), kaartPas());
  else if (p.kaart)
    map.setView(zichtbaarCentrum(p.kaart.centrum, p.kaart.zoom), p.kaart.zoom);
  plaatsTab = "verhaal"; openPlaats(id);
}
// tik op een thema: alleen dít thema op de kaart, ingezoomd op zijn plekken, en
// het paneel half op Plekken. Met `lees` (ingedrukt houden, of een verwijzing
// in een tekst): het themaverhaal, paneel vol.
function focusThema(k, lees){
  alleenThema(k); verf();
  pasOpThema(k);
  themaTab = lees ? "verhaal" : "plekken";
  openThema(k);
  if (lees) zetStand("vol");
}

// zonder zoekterm: de beginpunten. De schaalstapel bovenaan, dan de thema's.
function startInhoud(){
  let h = '<div class="zkKop">Begin bij een plaats</div>';
  const eigenVan = id => ALL.filter(o => plaatsVan(o) === id);
  const volgorde = A.plaatsen.slice().sort((a,b) =>
    (eigenVan(b.id).length > 0) - (eigenVan(a.id).length > 0));
  h += volgorde.map(p => {
    const eigen = eigenVan(p.id);
    const gevuld = eigen.some(o => o.coord);
    const em = gevuld ? eigen.filter(o => o.coord).length + " plekken" :
               (p.verhaal_tekst && !p.onbevestigd) ? p.schaal + "verhaal" : "nog leeg";
    return zkRij({ soort:"plaats", id:p.id, naam:p.naam,
      sub: p.ondertitel || "", em, kleur: gevuld ? "#ffb020" : "#3b4250" });
  }).join("");
  h += '<div class="zkKop">Of begin bij een thema</div>' + themaTegels(Object.keys(T));
  h += '<div class="zkVoet"><button id="zoekVrij">Of verken vrij op de kaart &rarr;</button>' +
       '<button id="zoekFb" style="margin-left:6px">Iets melden</button></div>';
  return h;
}

function zoekResultaten(qq){
  const tokens = qq.split(/\s+/).filter(Boolean);
  const scoor = r => {
    let s = 0;
    const n = norm(r.naam);
    for (const t of tokens){
      if (n.startsWith(t)) s += 4;
      else if (n.split(/[\s\/–-]+/).some(w => w.startsWith(t))) s += 3;
      else if (n.includes(t)) s += 2;
      else if (r.sub && norm(r.sub).includes(t)) s += 1.2;
      else if (r.tekst.includes(t)) s += 0.6;
      else return 0;                      // elk woord moet ergens raken
    }
    return s;
  };
  const raak = zoekIndex.map(r => [scoor(r), r]).filter(x => x[0] > 0)
    .sort((a,b) => b[0] - a[0]);
  if (!raak.length)
    return '<div class="zkLeeg">Niets gevonden voor “' + esc(qq) + '”. ' +
           'De proefdata beslaat ' + stedenMetInhoud().map(p => p.naam).join(", ") +
           ' — zoek op een plek, een thema of een plaats daar.</div>';
  // groepen op volgorde van hun beste treffer, zodat het sterkste antwoord bovenaan staat
  const soorten = [["plaats","Plaatsen"],["thema","Thema’s"],
                   ["plek","Plekken op de kaart"],["verhaal","Verhalen zonder pin"]];
  return soorten
    .map(([s, kop]) => ({ kop, rijen: raak.filter(x => x[1].soort === s) }))
    .filter(g => g.rijen.length)
    .sort((a,b) => b.rijen[0][0] - a.rijen[0][0])
    .map(g => '<div class="zkKop">' + g.kop + "</div>" + g.rijen.map(x => zkRij(x[1])).join(""))
    .join("");
}

function renderZoek(q){
  const qq = norm(q.trim());
  uit.innerHTML = qq ? zoekResultaten(qq) : startInhoud();
  uit.querySelectorAll("[data-kies]").forEach(b =>
    b.onclick = () => kiesUitZoek(b.dataset.soort, b.dataset.kies));
  uit.querySelectorAll("[data-thema]").forEach(b =>
    bindDruk(b, () => kiesUitZoek("thema", b.dataset.thema), () => { sluitZoek(); focusThema(b.dataset.thema, true); }));
  const fbKnop = uit.querySelector("#zoekFb");
  if (fbKnop) fbKnop.onclick = () => { sluitZoek(); fbRegister(); };
  const vrij = uit.querySelector("#zoekVrij");
  if (vrij) vrij.onclick = () => {
    sluitZoek();
    map.fitBounds(L.latLngBounds(A.pois.map(p => p.coord)), { padding:[70,90], maxZoom:16 });
  };
}

function kiesUitZoek(soort, id){
  sluitZoek();
  if (soort === "plaats") return focusPlaats(id);
  if (soort === "thema")  return focusThema(id);
  const o = byId(id);
  if (o && !o.coord){     // gebiedsverhaal: geen pin, dus de eigen stad als decor
    const stad = ALL.filter(x => plaatsVan(x) === plaatsVan(o) && x.coord);
    map.fitBounds(L.latLngBounds((stad.length ? stad : A.pois).map(p => p.coord)), kaartPas());
  }
  open(id);
}

function openZoek(){
  document.body.classList.remove("open", "max");
  document.body.classList.add("zoek");
  veld.value = "";
  renderZoek("");
  zoekEl.scrollTop = 0;

function sluitZoek(){

veld.addEventListener("input", () => renderZoek(veld.value));

document.addEventListener("keydown", e => {

document.getElementById("zoekX").onclick = () => sluitZoek();

/* ---------- feedback: correcties en meldingen ----------------------------

   bureauonderzoek — maar ook die gaat eerst door verify.py.

   Zolang SUPABASE leeg is bewaart de app meldingen op het toestel zelf; zodra
   de sleutels er staan gaan ze naar de database en spoelt de wachtrij mee.  */
const APP_VERSIE = "2026-09-05";
const SUPABASE = {
  url: "https://nurbdpjqihvaygsnivvz.supabase.co",
  // De anon-sleutel hoort openbaar te zijn: de toegangsregels in Supabase
  // bepalen wat hij mag (toevoegen als open, lezen wat open is, verder niets).

};

const FB_SLEUTEL = "explorerapp-feedback-v1";
const fbLokaal  = () => { try { return JSON.parse(localStorage.getItem(FB_SLEUTEL) || "[]"); } catch (_) { return []; } };
const fbBewaar  = rij => { try { localStorage.setItem(FB_SLEUTEL, JSON.stringify(rij)); } catch (_) {} };
const fbNieuwId = () => "fb_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);

async function fbNaarServer(item){
  if (!SUPABASE.url) return false;
  try {
    const r = await fetch(SUPABASE.url + "/rest/v1/feedback", {
      method: "POST",
      headers: { "Content-Type":"application/json", apikey: SUPABASE.sleutel,
                 Authorization: "Bearer " + SUPABASE.sleutel, Prefer: "return=minimal" },
      body: JSON.stringify(item)
    });

}

// alles wat nog op het toestel staat alsnog versturen
async function fbSpoel(){

  for (const item of rij) if (!await fbNaarServer(item)) over.push(item);
  fbBewaar(over);
}

const fbWachtrij = () => fbLokaal().map(x => ({ ...x, _wacht: true }));

/* ---- het formulier ---- */
let fbConcept = null, fbMarker = null, fbLijn = null, fbSleepend = false;

const FB_SOORTEN = [["coordinaat","Punt ligt verkeerd"], ["feit","Klopt niet"],
                    ["bron","Bron ontbreekt"], ["overig","Iets anders"]];

const fbAfstand = () => fbConcept && fbConcept.nieuw
  ? Math.round(map.distance(fbConcept.oude, fbConcept.nieuw)) : 0;

function fbStart(o){
  fbConcept = { punt: o ? o.id : null, punt_naam: o ? o.naam : null,
                plaats: o ? plaatsVan(o) : null,
                oude: o && o.coord ? o.coord.slice() : null, nieuw: null,

}

function fbTeken(){

  }

  h += '<textarea id="fbTekst" rows="5" placeholder="' +

      : c.soort === "coordinaat" ? "Bijvoorbeeld: staat aan de overkant van de straat."
      : "Vertel maar.") + '"></textarea>';
  h += '<button class="fbActie hoofd" data-fbstuur>Versturen</button>';
  h += '<div class="cap">Er wordt niets over jou vastgelegd: geen naam, geen locatie, geen account. ' +
       "Open meldingen zijn voor iedereen zichtbaar in het register.</div>";

  const veld = document.getElementById("fbTekst");
  veld.value = c.tekst;
  veld.oninput = () => c.tekst = veld.value;

  scroll.querySelectorAll("[data-fbsoort]").forEach(b =>
    b.onclick = () => { c.soort = b.dataset.fbsoort; fbTeken(); });

/* ---- de pin verzetten ---- */
function fbSleepAan(){
  const c = fbConcept; if (!c || !c.oude) return;
  fbSleepend = true;
  zetStand("half");
  const start = c.nieuw || c.oude;
  if (map.getZoom() < 18) map.setView(zichtbaarCentrum(start, 19), 19);
  else map.panTo(zichtbaarCentrum(start, map.getZoom()));

  const el = document.createElement("div");
  el.className = "fbPin";
  fbMarker = L.marker(start, { draggable: true, zIndexOffset: 2000, autoPan: true,
    icon: L.divIcon({ html: el, className: "", iconSize: [0,0], iconAnchor: [0,0] }) }).addTo(map);
  fbLijn = L.polyline([c.oude, start], { color: "#ffb020", weight: 2, dashArray: "5 5" }).addTo(map);

  const zet = ll => {
    c.nieuw = [+ll.lat.toFixed(6), +ll.lng.toFixed(6)];
    fbLijn.setLatLngs([c.oude, c.nieuw]);
    const m = document.getElementById("fbMeter");
    if (m) m.textContent = fbAfstand() + " meter verplaatst";
  };
  fbMarker.on("drag", e => zet(e.target.getLatLng()));
  fbMarker.on("dragend", e => zet(e.target.getLatLng()));
  map.on("click", fbKaartTik);

  scroll.innerHTML =
    "<h1>Zet de pin goed</h1>" +
    '<div class="sub">Sleep de oranje pin, of tik op de kaart. Zoom gerust helemaal in.</div>' +
    '<div class="note" id="fbMeter">' + (c.nieuw ? fbAfstand() + " meter verplaatst" : "Nog niet verplaatst") + "</div>" +
    '<button class="fbActie hoofd" data-fbklaar>Klaar</button>' +
    '<button class="fbActie" data-fbaf>Annuleren</button>';
  scroll.querySelector("[data-fbklaar]").onclick = () => { fbSleepUit(); fbTeken(); };
  scroll.querySelector("[data-fbaf]").onclick = () => { fbConcept.nieuw = null; fbSleepUit(); fbTeken(); };
}
function fbKaartTik(e){ if (fbMarker){ fbMarker.setLatLng(e.latlng); fbMarker.fire("dragend", { target: fbMarker }); } }
function fbSleepUit(){
  fbSleepend = false;
  map.off("click", fbKaartTik);
  if (fbMarker) { map.removeLayer(fbMarker); fbMarker = null; }
  if (fbLijn)   { map.removeLayer(fbLijn);   fbLijn = null; }
}
function fbStop(){ fbSleepUit(); fbConcept = null; }

/* ---- versturen ---- */
async function fbStuur(){
  const c = fbConcept; if (!c) return;
  if (c.soort === "coordinaat" && !c.nieuw && !c.tekst.trim())
    return toast("Verzet de pin, of schrijf er iets bij.");
  if (c.soort !== "coordinaat" && !c.tekst.trim())
    return toast("Schrijf even wat er niet klopt.");

  const item = { id: fbNieuwId(), tijd: new Date().toISOString(), soort: c.soort,
    punt: c.punt, punt_naam: c.punt_naam, plaats: c.plaats,
    oude_lat: c.oude ? c.oude[0] : null, oude_lon: c.oude ? c.oude[1] : null,
    nieuwe_lat: c.nieuw ? c.nieuw[0] : null, nieuwe_lon: c.nieuw ? c.nieuw[1] : null,
    afstand_m: c.nieuw ? fbAfstand() : null,
    zoom: c.nieuw ? +map.getZoom().toFixed(1) : null,
    tekst: c.tekst.trim().slice(0, 2000), app_versie: APP_VERSIE, status: "open" };

  const weg = await fbNaarServer(item);
  if (!weg){ const rij = fbLokaal(); rij.push(item); fbBewaar(rij); }
  const punt = c.punt;
  fbStop();
  toast(weg ? "Bedankt — je melding staat in het register."
            : "Bewaard op dit toestel; hij gaat mee zodra er verbinding is.");
  punt ? open(punt) : openZoek();
}

/* ---- de wachtrij delen ----------------------------------------------
   Zolang er geen database achter zit (of er geen verbinding was) staan
   meldingen op het toestel. Deze knop geeft ze mee aan de redactie: via het
   deelvenster van de telefoon, of naar het klembord.                     */
function fbAlsTekst(items){
  const regels = items.map((x, i) => {
    let r = (i + 1) + ". " + (x.punt_naam || "Algemene melding") +
            (x.punt ? " [" + x.punt + "]" : "") + " — " +
            (FB_SOORTEN.find(s => s[0] === x.soort) || ["","melding"])[1].toLowerCase();
    if (x.nieuwe_lat != null)
      r += "\n   van " + x.oude_lat + "," + x.oude_lon +
           " naar " + x.nieuwe_lat + "," + x.nieuwe_lon +
           " (" + x.afstand_m + " m, zoom " + x.zoom + ")";
    if (x.tekst) r += "\n   \u201c" + x.tekst + "\u201d";
    return r;
  });
  return "ExplorerApp feedback \u2014 " + items.length + " melding" + (items.length === 1 ? "" : "en") +
         "\n\n" + regels.join("\n") +
         "\n\n--- ruwe gegevens ---\n" + JSON.stringify(items);
}

async function fbDeel(items){
  const tekst = fbAlsTekst(items);
  if (navigator.share){
    try { await navigator.share({ title: "ExplorerApp feedback", text: tekst }); return toast("Gedeeld."); }
    catch (_) { return; }                       // afgebroken door de gebruiker
  }
  try { await navigator.clipboard.writeText(tekst); return toast("Gekopieerd \u2014 plak het in de chat."); }
  catch (_) {}
  scroll.innerHTML = "<h1>Meldingen</h1>" +
    '<div class="sub">Kopiëren lukte niet. Selecteer de tekst hieronder en kopieer hem met de hand.</div>' +
    '<textarea rows="14"></textarea><button class="fbActie" data-fbterug>&lsaquo; terug</button>';
  scroll.querySelector("textarea").value = tekst;
  scroll.querySelector("[data-fbterug]").onclick = fbRegister;
}
